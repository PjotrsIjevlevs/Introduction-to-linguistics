<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foundations of Linguistics — Trial Lesson</title>
<style>
:root{--bg:#f8f6ef;--green:#496348;--green2:#677e58;--light:#dce2cf;--pale:#ecefe0;--warm:#cf9a5b;--terracotta:#b17051;--text:#2d312b;--white:#fffffa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
#app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}.deck{width:min(1180px,96vw);aspect-ratio:16/9;background:var(--bg);position:relative;overflow:hidden;border-radius:22px;box-shadow:0 18px 55px rgba(50,55,45,.13)}
.slide{position:absolute;inset:0;padding:7% 7.5%;display:none}.slide.active{display:block}.kicker{font-size:12px;letter-spacing:.12em;font-weight:800;color:var(--green2);margin-bottom:12px}
h1{font-size:clamp(28px,3vw,44px);line-height:1.05;color:var(--green);margin:.1em 0 .55em}h2{font-size:clamp(22px,2.5vw,34px);color:var(--green);margin:0 0 1em}
.subtitle{font-size:clamp(18px,2vw,26px);color:var(--terracotta)}ul{font-size:clamp(17px,1.7vw,25px);line-height:1.45;padding-left:1.1em}li{margin:.45em 0}
.pill{display:inline-block;background:var(--pale);color:var(--green);padding:8px 18px;border-radius:999px;font-size:13px;font-weight:800;letter-spacing:.05em}
.arch{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:var(--white);border:1px solid var(--light);border-radius:18px;padding:18px;min-height:120px}.card strong{display:block;color:var(--green);font-size:14px;margin-bottom:8px}.card span{font-size:14px;line-height:1.35}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:24px}.compare .card{background:var(--pale)}.quiz{display:flex;gap:24px;justify-content:center;margin-top:35px}
.option{border:2px solid var(--green2);background:var(--white);border-radius:18px;padding:24px 40px;font-size:28px;font-weight:800;color:var(--green);cursor:pointer}
.option:hover{background:var(--light)}.note{margin-top:25px;text-align:center;color:var(--terracotta);font-weight:700;font-size:18px}
.footer{position:absolute;bottom:3%;left:7.5%;right:7.5%;display:flex;justify-content:space-between;color:#666b5f;font-size:12px}
.controls{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px}button{border:0;background:var(--green);color:white;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.progress{position:fixed;bottom:0;left:0;height:4px;background:var(--warm);transition:width .2s}
</style></head><body><div id="app"><div class="deck" id="deck"></div></div><div class="controls"><button id="prev">←</button><button id="next">→</button></div><div class="progress" id="progress"></div>
<script>
const data=[{"title": "FOUNDATIONS OF LINGUISTICS", "subtitle": "How Language Works", "kicker": "TRIAL LESSON · 25 MINUTES", "type": "title"}, {"title": "One thing you already know", "bullets": ["You can produce and understand sentences you have never heard before.", "You rarely think consciously about the rules that make them possible.", "So… where is that knowledge?"], "prompt": "Think of one sentence you could say right now that you have never memorized.", "type": "content"}, {"title": "What is linguistics?", "bullets": ["Linguistics is the scientific study of human language.", "A linguist asks: What patterns exist? What evidence supports them? Why do they occur?", "The goal is description and explanation — not deciding which language variety is 'better'."], "type": "content"}, {"title": "Language is a system", "center": "FORM  ↔  MEANING", "bullets": ["Words connect forms with meanings.", "Sounds/signs combine according to patterns.", "Words combine into larger structures.", "Meaning depends on structure and context."], "type": "diagram"}, {"title": "Your mental grammar", "bullets": ["A mental grammar is the shared system of knowledge that lets language users understand and produce language.", "Much of it is implicit: you know it without being able to state the rule.", "Writing is important for literate users, but literacy is not required for grammatical competence."], "type": "content"}, {"title": "The architecture of language", "items": [["PHONETICS", "How linguistic signals are physically produced and perceived."], ["PHONOLOGY", "How sounds/signs are organized and patterned."], ["MORPHOLOGY", "How meaningful pieces combine inside words."], ["SYNTAX", "How words combine into phrases and sentences."], ["SEMANTICS", "How linguistic structure contributes to meaning."], ["PRAGMATICS", "How context shapes interpretation."]], "type": "architecture"}, {"title": "Mini linguistic experiment", "question": "Which could be an English word?", "options": ["A. blifter", "B. lbitfer"], "follow": "You probably prefer A — even though neither word exists.", "type": "quiz"}, {"title": "You just used linguistic evidence", "bullets": ["Your judgment is not about politeness or spelling.", "It is an observation about what English allows.", "That points to phonotactics: language-specific constraints on how sounds can be combined."], "type": "content"}, {"title": "Descriptive ≠ prescriptive", "columns": [["DESCRIPTIVE", "What patterns do speakers actually use?"], ["PRESCRIPTIVE", "What forms are people told they should use?"]], "examples": ["Descriptive: English speakers commonly use “viruses.”", "Prescriptive: “You should say X because that is the correct form.”"], "type": "compare"}, {"title": "A linguist's mindset", "bullets": ["Observe before judging.", "Look for patterns, not isolated examples.", "Test a hypothesis against data.", "Ask what a speaker's knowledge must look like to produce the pattern."], "type": "content"}, {"title": "Three ideas to take away", "numbered": ["Language is systematic — even when its rules are invisible to us.", "Linguistics studies those systems empirically.", "The rest of the course is a toolkit for discovering how the system works."], "type": "closing"}, {"title": "Where we go next", "bullets": ["Next: how speech sounds are produced and represented.", "Then: how languages organize those sounds into systems.", "Later: words → sentences → meaning → context → variation → mind."], "type": "roadmap"}, {"title": "THANK YOU", "subtitle": "Next time: The Sounds of Language", "kicker": "FOUNDATIONS OF LINGUISTICS", "type": "title"}, {"title": "Sources & design note", "bullets": ["Anderson et al. Essentials of Linguistics, 2nd ed. (eCampusOntario), especially Chapters 1, 3 and 4.", "Language Files, 12th ed., especially Chapters 1–3.", "MIT OpenCourseWare 24.900 Introduction to Linguistics, Spring 2022, phonology materials.", "This deck is an original instructional synthesis; examples and wording have been adapted rather than reproduced from source slides."], "type": "sources"}];const deck=document.getElementById('deck');let i=0;
const esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function render(){deck.innerHTML='';data.forEach((s,n)=>{const el=document.createElement('section');el.className='slide'+(n===0?' active':'');
if(s.type==='title'){el.innerHTML=`<div class="pill">${esc(s.kicker||'FOUNDATIONS OF LINGUISTICS')}</div><h1 style="margin-top:60px;font-size:clamp(40px,5vw,66px)">${esc(s.title)}</h1><div class="subtitle">${esc(s.subtitle||'')}</div>`}
else{el.innerHTML=`<div class="kicker">FOUNDATIONS OF LINGUISTICS</div><h2>${esc(s.title)}</h2>`;
if(s.type==='architecture'){const a=document.createElement('div');a.className='arch';s.items.forEach(x=>a.innerHTML+=`<div class="card"><strong>${esc(x[0])}</strong><span>${esc(x[1])}</span></div>`);el.appendChild(a)}
else if(s.type==='quiz'){el.innerHTML+=`<p style="font-size:26px;text-align:center">${esc(s.question)}</p><div class="quiz"><button class="option">A. blifter</button><button class="option">B. lbitfer</button></div><div class="note">${esc(s.follow)}</div>`}
else if(s.type==='compare'){const c=document.createElement('div');c.className='compare';s.columns.forEach(x=>c.innerHTML+=`<div class="card"><strong>${esc(x[0])}</strong><span>${esc(x[1])}</span></div>`);el.appendChild(c);el.innerHTML+=`<p style="margin-top:28px;font-size:14px"><b>Example:</b> ${esc(s.examples.join(' · '))}</p>`}
else if(s.type==='closing'){s.numbered.forEach((x,j)=>el.innerHTML+=`<div style="display:flex;gap:18px;align-items:flex-start;margin:18px 0"><div style="width:34px;height:34px;border-radius:50%;background:var(--green);color:white;display:flex;align-items:center;justify-content:center;font-weight:800">${j+1}</div><div style="font-size:22px;line-height:1.3">${esc(x)}</div></div>`)}
else{if(s.bullets)el.innerHTML+=`<ul>${s.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`;if(s.prompt)el.innerHTML+=`<div class="card" style="margin-top:18px"><strong>TRY IT</strong><span>${esc(s.prompt)}</span></div>`;if(s.center)el.innerHTML+=`<div style="text-align:center;color:var(--terracotta);font-size:30px;font-weight:800;margin:25px">${esc(s.center)}</div>`}
}el.innerHTML+=`<div class="footer"><span>How Language Works</span><span>${String(n+1).padStart(2,'0')}</span></div>`;deck.appendChild(el)});update()}
function update(){document.querySelectorAll('.slide').forEach((s,n)=>s.classList.toggle('active',n===i));document.getElementById('progress').style.width=((i+1)/data.length*100)+'%';document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===data.length-1}
document.getElementById('prev').onclick=()=>{if(i>0){i--;update()}};document.getElementById('next').onclick=()=>{if(i<data.length-1){i++;update()}};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev').click()});render();
</script></body></html>
